[workspace]
channels = ["conda-forge", "bioconda", "nodefaults"]
name = "aeDNA"
platforms = ["linux-64"]
version = "1.1.0"

[tasks]

[dependencies]
snakemake = ">=9.0.1,<10"
snakemake-executor-plugin-slurm = ">=1.1.0,<2"
snakemake-storage-plugin-http = ">=0.3.0,<0.4"
snakemake-storage-plugin-ftp = ">=0.1.3,<0.2"
snakemake-storage-plugin-fs = ">=1.1.3,<2"
snakemake-logger-plugin-snkmt = ">=0.1.4,<0.2"
snakemake-logger-plugin-panoptes = ">=0.2.2,<0.3"
conda = ">=25.1.1,<27"
sqlalchemy = ">=2.0.43,<3"
sqlalchemy-utils = ">=0.42.0,<1"
psycopg2 = ">=2.9.10,<3"

[environments]
test = { features = ["test"] }
format = { features = ["format"], no-default-feature = true }

[feature.test.dependencies]
pytest = ">=9.0.2"
graphviz = ">=12.2.1"
picard-slim = ">=3.4.0,<4"

[feature.format.dependencies]
ruff = ">=0.15.1"
snakefmt = ">=0.11.5"
